<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UniversalHistory</title>
<style>
  :root { --bg:#fff5f7; --panel:#fff; --line:#e4e7ec; --text:#27272a; --muted:#71717a; --accent:#4f7cff; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; overflow:hidden; background:var(--bg); color:var(--text);
    font:14px "Segoe UI","Microsoft YaHei",sans-serif; }
  button,select,input,textarea { font:inherit; color:inherit; }
  button { cursor:pointer; }
  #app { display:flex; flex-direction:column; height:100%; }
  #workspace { flex:1; display:flex; min-height:0; }
  #canvas-wrap { flex:1; position:relative; min-width:0; }
  #canvas { width:100%; height:100%; display:block; cursor:grab; }
  #canvas.dragging { cursor:grabbing; }
  #status { position:absolute; right:12px; bottom:10px; z-index:3; padding:4px 10px;
    border:1px solid var(--line); border-radius:999px; background:rgba(255,255,255,.92);
    color:var(--muted); font-size:12px; }
  #menubar { display:flex; align-items:center; gap:2px; height:34px; padding:0 8px;
    background:#f9fafb; border-bottom:1px solid var(--line); }
  .menu { position:relative; }
  .menu>button { border:0; background:transparent; padding:6px 10px; border-radius:4px; }
  .menu>button:hover,.menu.open>button { background:#eef2ff; color:var(--accent); }
  .menu-list { display:none; position:absolute; top:100%; left:0; z-index:40; min-width:220px;
    padding:5px; background:var(--panel); border:1px solid var(--line); border-radius:6px;
    box-shadow:0 10px 30px rgba(0,0,0,.14); }
  .menu.open .menu-list { display:block; }
  .menu-item { display:flex; width:100%; justify-content:space-between; gap:20px; border:0;
    background:transparent; text-align:left; padding:7px 9px; border-radius:4px; }
  .menu-item:hover { background:#eef2ff; color:var(--accent); }
  .menu-item kbd { color:var(--muted); font:11px/1.3 "Segoe UI",sans-serif; }
  .menu-sep { height:1px; margin:4px 2px; background:var(--line); }
  #toolbar { display:flex; gap:6px; align-items:center; padding:7px 9px; background:var(--panel);
    border-bottom:1px solid var(--line); }
  #toolbar button { padding:5px 10px; border:1px solid var(--line); background:#fff; border-radius:5px; }
  #toolbar button:hover { border-color:var(--accent); color:var(--accent); }
  .spacer { flex:1; }
  #editor { width:420px; display:none; flex-direction:column; min-height:0; background:var(--panel);
    border-left:1px solid var(--line); }
  #editor.open { display:flex; }
  .editor-head { padding:12px 14px 8px; border-bottom:1px solid var(--line); }
  .editor-head h2 { margin:0 0 8px; font-size:17px; }
  .source-row,.record-row { display:flex; gap:7px; align-items:center; }
  .record-row { margin-top:7px; }
  .source-row select,.record-row select { flex:1; min-width:0; }
  #editor-tabs { display:flex; border-bottom:1px solid var(--line); }
  #editor-tabs button { flex:1; padding:9px; border:0; border-bottom:2px solid transparent; background:#fafafa; }
  #editor-tabs button.active { background:#fff; color:var(--accent); border-bottom-color:var(--accent); }
  .editor-page { display:none; flex:1; overflow:auto; padding:13px; }
  .editor-page.active { display:block; }
  .field { margin-bottom:11px; }
  .field label { display:block; margin-bottom:4px; color:var(--muted); font-size:12px; }
  .field input,.field textarea,.field select { width:100%; padding:7px 8px; border:1px solid var(--line); border-radius:5px; }
  .field textarea { min-height:78px; resize:vertical; }
  .field-row { display:flex; gap:8px; align-items:center; }
  .field-row input[type=text] { flex:1; }
  .field-row label { display:flex; gap:4px; align-items:center; margin:0; }
  .radio-grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:3px; }
  .radio-grid label { display:flex; align-items:center; gap:3px; font-size:12px; }
  .actions { display:flex; gap:8px; padding:11px 14px; border-top:1px solid var(--line); }
  .btn { padding:6px 11px; border:1px solid var(--line); background:#fff; border-radius:5px; }
  .btn-primary { border-color:var(--accent); background:var(--accent); color:#fff; }
  .btn-danger { border-color:#b91c1c; background:#b91c1c; color:#fff; }
  #editor-error { min-height:17px; padding:0 14px 8px; color:#b91c1c; font-size:12px; }
  .detail-label { margin:11px 0 3px; color:var(--muted); font-size:12px; font-weight:600; }
  .detail-value { white-space:pre-wrap; word-break:break-word; }
  .dialog-overlay { position:fixed; inset:0; z-index:50; display:none; align-items:center;
    justify-content:center; background:rgba(20,20,25,.45); }
  .dialog-overlay.open { display:flex; }
  .dialog { width:min(720px,calc(100vw - 32px)); max-height:min(680px,calc(100vh - 32px));
    display:flex; flex-direction:column; background:var(--panel); border-radius:8px;
    box-shadow:0 18px 50px rgba(0,0,0,.22); }
  .dialog-header { display:flex; align-items:center; justify-content:space-between; padding:14px 16px 6px; }
  .dialog-header h3 { margin:0; }
  .dialog-hint { margin:0 16px 10px; color:var(--muted); font-size:12px; }
  .dialog-error { min-height:16px; margin:0 16px 8px; color:#b91c1c; font-size:12px; }
  .dialog-body { margin:0 12px 12px; padding:0 5px; overflow:auto; }
  .dialog-footer { display:flex; justify-content:flex-end; gap:8px; padding:0 16px 14px; }
  .file-item,.thread-item,.row { display:flex; gap:10px; align-items:center; padding:9px 8px;
    border-bottom:1px solid #f0f0f2; }
  .file-item:last-child { border-bottom:0; }
  .file-details,.thread-details { flex:1; min-width:0; }
  .file-name { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .file-path,.thread-sub { color:var(--muted); font-size:12px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  .file-meta { margin-top:3px; color:#8b8b92; font-size:11px; }
  .loaded-badge { padding:2px 8px; border-radius:999px; background:#eaf7ef; color:#18794e; font-size:11px; }
  .dialog-empty { padding:22px 8px; color:var(--muted); text-align:center; }
  .two-col { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .list-title { margin:0 0 6px; color:var(--muted); font-size:12px; font-weight:600; }
  .thread-item { margin-bottom:5px; border:1px solid var(--line); border-radius:5px; }
  .thread-item.selected { border-color:var(--accent); background:#f5f8ff; }
  .share-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:11px; }
  .share-row input[type=range] { width:100%; }
  .control-row { display:flex; flex-wrap:wrap; gap:7px; }
  .label-row { display:grid; grid-template-columns:minmax(80px,150px) 1fr auto; gap:6px;
    align-items:center; margin-bottom:6px; }
  .label-row input { padding:6px; border:1px solid var(--line); border-radius:4px; }
  #context-menu { display:none; position:fixed; z-index:70; min-width:190px; padding:4px;
    background:var(--panel); border:1px solid var(--line); border-radius:6px;
    box-shadow:0 12px 30px rgba(0,0,0,.18); }
  #context-menu button { display:block; width:100%; padding:7px 10px; border:0;
    background:transparent; text-align:left; border-radius:4px; }
  #context-menu button:hover { background:#eef2ff; color:var(--accent); }
  #context-menu hr { margin:4px 2px; border:0; border-top:1px solid var(--line); }
  #tooltip { position:fixed; z-index:20; display:none; max-width:340px; padding:6px 9px;
    background:rgba(30,30,30,.93); color:#fff; border-radius:5px; font-size:12px;
    white-space:pre-line; pointer-events:none; }
</style>
</head>
<body>
<div id="app">
  <nav id="menubar">
    <div class="menu"><button data-menu-button>File</button><div class="menu-list">
      <button class="menu-item" data-action="files">Open server files…<kbd>Ctrl+O</kbd></button>
      <button class="menu-item" data-action="editor">Event Editor<kbd>Ctrl+E</kbd></button>
      <div class="menu-sep"></div>
      <button class="menu-item" data-action="save">Save active source</button>
      <button class="menu-item" data-action="reload">Reload from workspace</button>
    </div></div>
    <div class="menu"><button data-menu-button>View</button><div class="menu-list">
      <button class="menu-item" data-action="filter">Filter…<kbd>Ctrl+L</kbd></button>
      <button class="menu-item" data-action="threads">Thread Manager…<kbd>Ctrl+M</kbd></button>
      <div class="menu-sep"></div>
      <button class="menu-item" data-action="fit">Fit to View<kbd>Ctrl+0</kbd></button>
      <button class="menu-item" data-action="orientation">Toggle Orientation<kbd>Ctrl+T</kbd></button>
    </div></div>
    <div class="menu"><button data-menu-button>Help</button><div class="menu-list">
      <button class="menu-item" data-action="help">Help Contents</button>
      <button class="menu-item" data-action="about">About UniversalHistory</button>
    </div></div>
    <span class="spacer" style="text-align:right;font-size:12px;color:var(--muted)">timeline-centric workspace</span>
  </nav>
  <div id="workspace">
    <div id="canvas-wrap">
      <canvas id="canvas"></canvas>
      <div id="status">connecting…</div>
    </div>
    <aside id="editor">
      <div class="editor-head">
        <h2 id="editor-title">Event</h2>
        <div class="source-row"><select id="ed-source" aria-label="Source"></select></div>
        <div class="record-row">
          <select id="ed-record" aria-label="Record"></select>
          <button class="btn" id="ed-new">New</button>
          <button class="btn btn-danger" id="ed-delete">Delete</button>
        </div>
      </div>
      <div id="editor-tabs">
        <button data-tab="details" class="active">Details</button>
        <button data-tab="form">Form</button>
        <button data-tab="labels">Label Tags</button>
      </div>
      <div id="page-details" class="editor-page active"></div>
      <div id="page-form" class="editor-page">
        <div class="field"><label>UUID</label><input id="ed-uuid" readonly></div>
        <div class="field"><label>Time</label><div class="field-row"><input id="ed-time" type="text"><label><input id="lock-time" type="checkbox">Lock</label></div></div>
        <div class="field"><label>Focus</label><div class="radio-grid">
          <label><input name="ed-focus" type="radio" value="time">Time</label>
          <label><input name="ed-focus" type="radio" value="location">Location</label>
          <label><input name="ed-focus" type="radio" value="people">People</label>
          <label><input name="ed-focus" type="radio" value="organization">Org</label>
          <label><input name="ed-focus" type="radio" value="event" checked>Event</label>
        </div></div>
        <div class="field"><label>Location</label><div class="field-row"><input id="ed-location" type="text"><label><input id="lock-location" type="checkbox">Lock</label></div></div>
        <div class="field"><label>People</label><div class="field-row"><input id="ed-people" type="text"><label><input id="lock-people" type="checkbox">Lock</label></div></div>
        <div class="field"><label>Organization</label><div class="field-row"><input id="ed-organization" type="text"><label><input id="lock-organization" type="checkbox">Lock</label></div></div>
        <div class="field"><label>Tags</label><div class="field-row"><input id="ed-tags" type="text"><label><input id="lock-tags" type="checkbox">Lock</label></div></div>
        <div class="field"><label>Title</label><input id="ed-title" type="text"></div>
        <div class="field"><label>Brief</label><textarea id="ed-brief"></textarea></div>
        <div class="field"><label>Event</label><textarea id="ed-event"></textarea></div>
      </div>
      <div id="page-labels" class="editor-page"><div id="label-table"></div><button class="btn" id="add-label">Add Label</button></div>
      <div id="editor-error"></div>
      <div class="actions">
        <button class="btn btn-primary" id="ed-apply">Apply</button>
        <button class="btn" id="ed-edit">Edit</button>
        <button class="btn" id="ed-cancel">Cancel</button>
        <button class="btn" id="ed-close">Close</button>
      </div>
    </aside>
  </div>
</div>
<div id="file-dialog" class="dialog-overlay" role="dialog" aria-modal="true">
  <div class="dialog"><div class="dialog-header"><h3>Server Files</h3><button class="btn" data-close="file-dialog">×</button></div>
    <p class="dialog-hint">Only files exposed by the server are shown.</p>
    <div class="dialog-error" id="file-error"></div><div class="dialog-body" id="file-list"></div></div>
</div>
<div id="thread-dialog" class="dialog-overlay" role="dialog" aria-modal="true">
  <div class="dialog" style="width:min(900px,calc(100vw - 32px))">
    <div class="dialog-header"><h3>Thread Manager</h3><button class="btn" data-close="thread-dialog">×</button></div>
    <div class="dialog-error" id="thread-error"></div>
    <div class="dialog-body">
      <div class="share-row">
        <div><label class="list-title">Axis Offset</label><input id="axis-offset" type="range" min="0" max="100" step="1"></div>
        <div><label class="list-title">Add loaded source</label><div class="control-row"><select id="thread-add-source" style="flex:1"></select><button class="btn" id="thread-add-left">Add Left</button><button class="btn" id="thread-add-right">Add Right</button></div></div>
      </div>
      <div class="two-col"><div><p class="list-title">Left Threads</p><div id="left-threads"></div></div><div><p class="list-title">Right Threads</p><div id="right-threads"></div></div></div>
      <div class="field" style="margin-top:14px"><label>Thread Share (0.01–0.99)</label><input id="thread-share" type="number" min="0.01" max="0.99" step="0.05"></div>
      <div class="control-row"><button class="btn" id="thread-up">Move Up</button><button class="btn" id="thread-down">Move Down</button><button class="btn" id="thread-switch">Switch Side</button><button class="btn btn-danger" id="thread-remove">Remove</button></div>
    </div>
    <div class="dialog-footer"><button class="btn btn-primary" data-close="thread-dialog">Close</button></div>
  </div>
</div>
<div id="filter-dialog" class="dialog-overlay" role="dialog" aria-modal="true">
  <div class="dialog"><div class="dialog-header"><h3>Filter Events</h3><button class="btn" data-close="filter-dialog">×</button></div>
    <div class="dialog-body">
      <div class="two-col">
        <div class="field"><label>Source (empty = all)</label><select id="filter-source"></select></div>
        <div class="field"><label>Focus Label</label><input id="filter-focus" list="focus-list" placeholder="event"><datalist id="focus-list"><option value=""></option><option>time</option><option>location</option><option>people</option><option>organization</option><option>event</option></datalist></div>
      </div>
      <div class="field"><label>Include Labels (label: tags; label2: tags)</label><input id="filter-include" placeholder="tags: tag1; author: Sleepy"></div>
      <div class="field"><label>Exclude Labels (label: tags; label2: tags)</label><input id="filter-exclude" placeholder="tags: draft"></div>
      <div class="two-col"><div class="field"><label>Time From</label><input id="filter-from" placeholder="e.g. 2000"></div><div class="field"><label>Time To</label><input id="filter-to" placeholder="e.g. 2020"></div></div>
    </div>
    <div class="dialog-error" id="filter-error"></div>
    <div class="dialog-footer"><button class="btn" data-close="filter-dialog">Cancel</button><button class="btn btn-primary" id="filter-apply">Apply</button></div>
  </div>
</div>
<div id="quick-dialog" class="dialog-overlay" role="dialog" aria-modal="true">
  <div class="dialog" style="width:min(520px,calc(100vw - 32px))"><div class="dialog-header"><h3>Quick Entry</h3><button class="btn" data-close="quick-dialog">×</button></div>
    <p class="dialog-hint" id="quick-target"></p><div class="dialog-error" id="quick-error"></div>
    <div class="dialog-body"><div class="field"><label>Title</label><input id="quick-title"></div><div class="field"><label>Natural-language time</label><input id="quick-time"></div></div>
    <div class="dialog-footer"><button class="btn" data-close="quick-dialog">Cancel</button><button class="btn btn-primary" id="quick-apply">Create</button></div></div>
</div>
<div id="text-dialog" class="dialog-overlay" role="dialog" aria-modal="true">
  <div class="dialog" style="width:min(680px,calc(100vw - 32px))"><div class="dialog-header"><h3 id="text-title"></h3><button class="btn" data-close="text-dialog">×</button></div>
    <div class="dialog-body" id="text-body" style="white-space:pre-wrap"></div><div class="dialog-footer"><button class="btn btn-primary" data-close="text-dialog">Close</button></div></div>
</div>
<div id="context-menu"></div><div id="tooltip"></div>
<script>
"use strict";

const US_PER_DAY = 86400e6;
function jdToGregorian(jd) {
  const z = Math.floor(jd + 0.5), f = jd + 0.5 - z;
  const alpha = Math.floor((z - 1867216.25) / 36524.25);
  const a = z + 1 + alpha - Math.floor(alpha / 4);
  const b = a + 1524, c = Math.floor((b - 122.1) / 365.25);
  const d = Math.floor(365.25 * c), e = Math.floor((b - d) / 30.6001);
  const dayFloat = b - d - Math.floor(30.6001 * e) + f;
  const month = e < 14 ? e - 1 : e - 13;
  const year = month > 2 ? c - 4716 : c - 4715;
  const day = Math.floor(dayFloat), frac = dayFloat - day;
  const secs = Math.floor(frac * 86400 + 1e-6);
  return { year, month, day, hour: Math.floor(secs / 3600),
    minute: Math.floor((secs % 3600) / 60), second: secs % 60 };
}
function gregorianToJd(y, m, d) {
  const a = Math.floor((14 - m) / 12), y2 = y + 4800 - a, m2 = m + 12 * a - 3;
  return d + Math.floor((153 * m2 + 2) / 5) + 365 * y2 + Math.floor(y2 / 4) -
    Math.floor(y2 / 100) + Math.floor(y2 / 400) - 32045;
}
const usToJd = us => us / US_PER_DAY;
const jdToUs = jd => Math.round(jd * US_PER_DAY);

const DAY = 1, WEEK = 7, MONTH = 30, QUARTER = 90, YEAR = 365.2425;
const LEVELS = [
  { name: "minute", days: 1 / 1440, step: 1 }, { name: "10min", days: 10 / 1440, step: 10 },
  { name: "hour", days: 1 / 24, step: 1 }, { name: "6hour", days: 6 / 24, step: 6 },
  { name: "day", days: DAY, step: 1 }, { name: "week", days: WEEK, step: 1 },
  { name: "month", days: MONTH, step: 1 }, { name: "quarter", days: QUARTER, step: 3 },
  { name: "year", days: YEAR, step: 1 }, { name: "2year", days: 2 * YEAR, step: 2 },
  { name: "5year", days: 5 * YEAR, step: 5 }, { name: "10year", days: 10 * YEAR, step: 10 },
  { name: "20year", days: 20 * YEAR, step: 20 }, { name: "50year", days: 50 * YEAR, step: 50 },
  { name: "100year", days: 100 * YEAR, step: 100 }, { name: "200year", days: 200 * YEAR, step: 200 },
  { name: "500year", days: 500 * YEAR, step: 500 }, { name: "1000year", days: 1000 * YEAR, step: 1000 },
  { name: "2000year", days: 2000 * YEAR, step: 2000 }, { name: "5000year", days: 5000 * YEAR, step: 5000 }
];
const FADE_MIN = 50, FADE_FULL = 100, DEMOTE = 300;
function fmtYear(y) { return y <= 0 ? `${-(y - 1)} BC` : `${y}`; }
function tickLabel(jd, level) {
  const g = jdToGregorian(jd);
  if (level.name === "month") return `${g.year}-${String(g.month).padStart(2, "0")}`;
  if (level.name === "quarter") return `${g.year}-Q${Math.floor((g.month - 1) / 3) + 1}`;
  if (["minute", "10min", "hour", "6hour"].includes(level.name)) {
    return `${g.year}-${String(g.month).padStart(2, "0")}-${String(g.day).padStart(2, "0")} ${String(g.hour).padStart(2, "0")}:${String(g.minute).padStart(2, "0")}`;
  }
  return fmtYear(g.year);
}
function snapJd(jd, level) {
  const g = jdToGregorian(jd);
  if (["minute", "10min"].includes(level.name)) {
    const minute = g.minute - g.minute % level.step;
    return gregorianToJd(g.year, g.month, g.day) + (g.hour * 60 + minute) / 1440 - 0.5;
  }
  if (["hour", "6hour"].includes(level.name)) {
    const hour = g.hour - g.hour % level.step;
    return gregorianToJd(g.year, g.month, g.day) + hour / 24 - 0.5;
  }
  if (["day", "week"].includes(level.name)) return Math.floor(jd + 0.5) - 0.5;
  if (["month", "quarter"].includes(level.name)) {
    const m = level.name === "quarter" ? Math.floor((g.month - 1) / 3) * 3 + 1 : g.month;
    return gregorianToJd(g.year, m, 1) - 0.5;
  }
  const yy = g.year - (g.year % level.step + level.step) % level.step;
  return gregorianToJd(yy, 1, 1) - 0.5;
}
function nextJd(jd, level) {
  if (["minute", "10min", "hour", "6hour", "day", "week"].includes(level.name)) return jd + level.days;
  const g = jdToGregorian(jd + 0.1);
  if (level.name === "month") {
    let m = g.month + 1, y = g.year;
    if (m > 12) { m = 1; y++; }
    return gregorianToJd(y, m, 1) - 0.5;
  }
  if (level.name === "quarter") {
    let m = g.month + 3, y = g.year;
    if (m > 12) { m -= 12; y++; }
    return gregorianToJd(y, m, 1) - 0.5;
  }
  return gregorianToJd(g.year + level.step, 1, 1) - 0.5;
}
function tickLayers(centerJd, pxPerDay, length) {
  const out = [];
  for (const level of LEVELS) {
    const px = level.days * pxPerDay;
    if (px < FADE_MIN) continue;
    const alpha = px >= FADE_FULL ? 1 : (px - FADE_MIN) / (FADE_FULL - FADE_MIN);
    const role = px < FADE_FULL ? "minor" : px > DEMOTE ? "demoted" : "major";
    const start = centerJd - length / 2 / pxPerDay, end = centerJd + length / 2 / pxPerDay;
    const ticks = []; let t = snapJd(start, level), guard = 0;
    while (t < end && guard++ < 300) { if (t >= start) ticks.push(t); t = nextJd(t, level); }
    out.push({ level, ticks, alpha, role });
    if (px > DEMOTE) break;
  }
  return out;
}

const STORAGE_KEY = "universal-history.web.workspace.v2";

  ["#fff7e0", "#f5d98b"], ["#eef7e8", "#b5dfae"], ["#f3eefe", "#cdb7f6"]];

    for (const file of catalog.files) fileList.append(makeFileItem(file));
  } catch (error) {
    fileError.textContent = error.message; loading.textContent = "Unable to load the file list.";
  }
}
/* ---------- thread manager -------------------------------------------------- */
function sourceDisplay(source) { return source === "__filter__" ? "(filter result)" : source || "(empty thread)"; }
function firstWritableSource() {
  const thread = threads.find(t => t.source && t.source !== "__filter__");
  return thread ? thread.source : "";
}
function activeEditorSource() { return document.getElementById("ed-source").value || firstWritableSource(); }
function allThreadOptions() {
  return workspaceSources.filter(source => source && source !== "__filter__").sort();
}
function openThreadManager(source = "") {
  openDialog("thread-dialog");
  managerSelection = source || threads[0]?.source || null;
  renderThreadManager();
}
function renderThreadManager() {
  if (!document.getElementById("thread-dialog").classList.contains("open")) return;
  document.getElementById("axis-offset").value = viewState.axisOffset;
  const select = document.getElementById("thread-add-source"), oldValue = select.value;
  select.replaceChildren();
  const placeholder = document.createElement("option");
  placeholder.value = ""; placeholder.textContent = "No source selected";
  select.append(placeholder);
  for (const source of allThreadOptions()) {
    const option = document.createElement("option");
    option.value = source; option.textContent = sourceDisplay(source);
    select.append(option);
  }
  select.value = allThreadOptions().includes(oldValue) ? oldValue : "";
  select.onchange = renderThreadManager;
  const left = document.getElementById("left-threads"), right = document.getElementById("right-threads");
  left.replaceChildren(); right.replaceChildren();
  for (const thread of threads) {
    const container = thread.side === "left" ? left : right;
    const row = document.createElement("div");
    row.className = "thread-item" + (managerSelection === thread.source ? " selected" : "");
    const details = document.createElement("div"); details.className = "thread-details";
    const name = document.createElement("div"); name.textContent = sourceDisplay(thread.source);
    const sub = document.createElement("div"); sub.className = "thread-sub";
    sub.textContent = `${thread.eventCount} events · share=${Math.round(thread.share * 100)}%${thread.custom ? " · memory only" : ""}`;
    details.append(name, sub); row.append(details);
    row.onclick = () => { managerSelection = thread.source; renderThreadManager(); };
    container.append(row);
  }
  if (!left.children.length) { const empty = document.createElement("div"); empty.className = "dialog-empty"; empty.textContent = "No left threads"; left.append(empty); }
  if (!right.children.length) { const empty = document.createElement("div"); empty.className = "dialog-empty"; empty.textContent = "No right threads"; right.append(empty); }
  const selectedThread = threads.find(t => t.source === managerSelection);
  const shareInput = document.getElementById("thread-share");
  shareInput.disabled = !selectedThread || threads.filter(t => t.side === selectedThread.side).length <= 1;
  shareInput.value = selectedThread ? selectedThread.share.toFixed(2) : "";
  document.getElementById("thread-add-left").disabled = !select.value;
  document.getElementById("thread-add-right").disabled = !select.value;
}
document.getElementById("axis-offset").oninput = event => {
  viewState.axisOffset = Number(event.target.value); layout(); draw(); persist();
};
document.getElementById("thread-share").onchange = event => {
  const thread = threads.find(t => t.source === managerSelection);
  if (!thread) return;
  const share = Math.min(0.99, Math.max(0.01, Number(event.target.value) || 0.5));
  thread.share = share; threadMeta(thread.source).share = share;
  layout(); draw(); persist(); renderThreadManager();
};
document.getElementById("thread-add-left").onclick = () => addThreadFromSelection("left");
document.getElementById("thread-add-right").onclick = () => addThreadFromSelection("right");
function addThreadFromSelection(side) {
  const source = document.getElementById("thread-add-source").value;
  if (!source) return;
  const meta = threadMeta(source);
  meta.side = side; meta.visible = true;
  if (!threads.some(t => t.source === source)) {
    const maxOrder = Math.max(-1, ...Object.values(viewState.threadMeta).map(item => item.order ?? 0));
    meta.order = maxOrder + 1;
    const events = allEvents.filter(event => event.source === source);
    threads.push({ source, events, eventCount: events.length, side, share: meta.share,
      colorIdx: meta.colorIdx, order: meta.order, custom: false });
  }
  managerSelection = source;
  threads.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  layout(); draw(); persist(); renderThreadManager();
  setStatus(`${sourceDisplay(source)} added on the ${side} side`);
}
document.getElementById("thread-up").onclick = () => moveThread(-1);
document.getElementById("thread-down").onclick = () => moveThread(1);
function moveThread(delta) {
  const thread = threads.find(t => t.source === managerSelection);
  if (!thread) return;
  const sameSide = threads.filter(t => t.side === thread.side).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  const index = sameSide.indexOf(thread), swap = sameSide[index + delta];
  if (!swap) return;
  const oldOrder = thread.order;
  thread.order = swap.order; swap.order = oldOrder;
  threadMeta(thread.source).order = thread.order;
  threadMeta(swap.source).order = swap.order;
  threads.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  layout(); draw(); persist(); renderThreadManager();
}
function switchThreadSide(source) {
  const meta = threadMeta(source);
  meta.side = meta.side === "left" ? "right" : "left";
  meta.order = Math.max(-1, ...Object.values(viewState.threadMeta).map(item => item.order ?? 0)) + 1;
  const thread = threads.find(item => item.source === source);
  if (thread) { thread.side = meta.side; thread.order = meta.order; threads.sort((a, b) => (a.order ?? 0) - (b.order ?? 0)); }
  layout(); draw(); persist(); renderThreadManager();
}
function removeThread(source) {
  if (!confirm(`Remove '${sourceDisplay(source)}' from the view?\nEvents remain in the workspace.`)) return;
  threadMeta(source).visible = false;
  threads = threads.filter(thread => thread.source !== source);
  if (source === "__filter__") { filterEvents = null; viewState.filterConfig = null; }
  managerSelection = null;
  layout(); draw(); persist(); renderThreadManager();
}
document.getElementById("thread-switch").onclick = () => managerSelection && switchThreadSide(managerSelection);
document.getElementById("thread-remove").onclick = () => managerSelection && removeThread(managerSelection);

/* ---------- filter ----------------------------------------------------------- */
function openFilterDialog() {
  const select = document.getElementById("filter-source");
  select.replaceChildren();
  const empty = document.createElement("option"); empty.value = ""; empty.textContent = "(all sources)";
  select.append(empty);
  for (const thread of threads.filter(t => t.source !== "__filter__")) {
    const option = document.createElement("option"); option.value = thread.source;
    option.textContent = sourceDisplay(thread.source); select.append(option);
  }
  const config = viewState.filterConfig;
  if (config) {
    select.value = config.source || "";
    document.getElementById("filter-focus").value = config.focus || "";
    document.getElementById("filter-include").value = config.includeText || "";
    document.getElementById("filter-exclude").value = config.excludeText || "";
    document.getElementById("filter-from").value = config.fromText || "";
    document.getElementById("filter-to").value = config.toText || "";
  }
  openDialog("filter-dialog");
}
async function parseFilterBound(text, useUntil = false) {
  if (!text) return null;
  const parsed = await api(`/api/parse_time?text=${encodeURIComponent(text)}`);
  const value = useUntil && parsed.until != null ? parsed.until : parsed.since;
  if (value == null) throw new Error(text);
  return value;
}
async function applyFilter() {
  const error = document.getElementById("filter-error"); error.textContent = "";
  const config = {
    source: document.getElementById("filter-source").value,
    focus: document.getElementById("filter-focus").value.trim(),
    includeText: document.getElementById("filter-include").value,
    excludeText: document.getElementById("filter-exclude").value,
    fromText: document.getElementById("filter-from").value.trim(),
    toText: document.getElementById("filter-to").value.trim()
  };
  try {
    const lo = await parseFilterBound(config.fromText);
    const hi = await parseFilterBound(config.toText, true);
    const query = new URLSearchParams();
    if (config.source) query.set("source", config.source);
    if (config.focus) query.set("focus_label", config.focus);
    if (config.includeText.trim()) query.set("include_labels", config.includeText.trim());
    if (config.excludeText.trim()) query.set("exclude_labels", config.excludeText.trim());
    if (lo != null) query.set("time_from", String(lo));
    if (hi != null) query.set("time_to", String(hi));
    filterEvents = await api(`/api/events?${query.toString()}`);
    viewState.filterConfig = config;
    const meta = threadMeta("__filter__");
    meta.side = "left"; meta.visible = true;
    meta.colorIdx = THREAD_COLORS.length;
    if (!threads.some(thread => thread.source === "__filter__")) {
      threads.push({ source: "__filter__", events: filterEvents, eventCount: filterEvents.length,
        side: "left", share: meta.share, colorIdx: meta.colorIdx, order: meta.order,
        custom: true, fixedColors: ["#dce6f0", "#c8d2f0"] });
    }
    const thread = threads.find(item => item.source === "__filter__");
    thread.events = filterEvents; thread.eventCount = filterEvents.length;
    threads.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
    closeDialog("filter-dialog"); layout(); draw(); persist();
    setStatus(`Filter result: ${filterEvents.length} events`);
    if (filterEvents.length) fitToView();
  } catch (error) {
    error.textContent = `Parse Error: Cannot parse time: ${error.message}`;
  }
}
document.getElementById("filter-apply").onclick = applyFilter;
/* ---------- event editor ------------------------------------------------------ */
function switchTab(name) {
  if (!loadingEditor) {
    if (name === "labels" && editorTab !== "labels") syncTableFromForm();
    else if (name !== "labels" && editorTab === "labels") syncFormFromTable();
  }
  document.querySelectorAll("#editor-tabs button").forEach(button =>
    button.classList.toggle("active", button.dataset.tab === name));
  for (const page of ["details", "form", "labels"])
    document.getElementById(`page-${page}`).classList.toggle("active", page === name);
  editorTab = name;
}
document.querySelectorAll("#editor-tabs button").forEach(button =>
  button.onclick = () => switchTab(button.dataset.tab));
function sourceOptions() {
  return allThreadOptions();
}
function refreshEditor() {
  const sourceSelect = document.getElementById("ed-source"), oldValue = sourceSelect.value;
  sourceSelect.replaceChildren();
  const options = sourceOptions();
  if (!options.length) {
    const option = document.createElement("option");
    option.value = ""; option.textContent = "No writable source";
    sourceSelect.append(option);
  }
  for (const source of options) {
    const option = document.createElement("option");
    option.value = source; option.textContent = sourceDisplay(source);
    sourceSelect.append(option);
  }
  if (options.includes(oldValue)) sourceSelect.value = oldValue;
  else if (options.length) sourceSelect.value = options[0];
  if (!loadingEditor) refreshRecordList();
  if (selected && !editorDirty) loadEventIntoEditor(selected, false);
}
function refreshRecordList() {
  const combo = document.getElementById("ed-record"), source = document.getElementById("ed-source").value;
  const records = allEvents.filter(event => event.source === source).sort((a, b) =>
    (a.since ?? Number.MAX_SAFE_INTEGER) - (b.since ?? Number.MAX_SAFE_INTEGER));
  combo.replaceChildren();
  const blank = document.createElement("option");
  blank.value = ""; blank.textContent = "New record";
  combo.append(blank);
  for (const record of records) {
    const option = document.createElement("option");
    option.value = record.uuid;
    option.textContent = `[${record.since == null ? "?" : fmtIndexTime(record).split(" ~ ")[0]}] ${record.abstract || "(untitled)"}`;
    combo.append(option);
  }
  combo.value = selected?.uuid || "";
}
async function showEvent(uuid, edit = false) {
  selected = await api(`/api/events/${encodeURIComponent(uuid)}`);
  editor.classList.add("open"); resize();
  await loadEventIntoEditor(selected, false);
  if (edit) setEditMode(true);
}
function setEditMode(on) {
  document.getElementById("ed-apply").style.display = on ? "" : "none";
  document.getElementById("ed-edit").style.display = on ? "none" : "";
  if (on) switchTab("form"); else switchTab("details");
}
function addLabelRow(label = "", tags = "") {
  const row = document.createElement("div"); row.className = "label-row";
  row.innerHTML = `<input class="label-name" placeholder="label"><input class="label-tags" placeholder="tag1, tag2"><button class="btn">×</button>`;
  row.querySelector(".label-name").value = label;
  row.querySelector(".label-tags").value = tags;
  row.querySelector("button").onclick = () => { row.remove(); markDirty(); };
  row.querySelectorAll("input").forEach(input => input.oninput = markDirty);
  document.getElementById("label-table").append(row);
}
function syncTable(labels) {
  const table = document.getElementById("label-table");
  table.replaceChildren();
  for (const [label, tags] of Object.entries(labels || {})) addLabelRow(label, tags.join(", "));
  if (!table.children.length) addLabelRow("", "");
}
function labelTableLabels() {
  const labels = {};
  for (const row of document.querySelectorAll("#label-table .label-row")) {
    const label = row.querySelector(".label-name").value.trim();
    const tags = row.querySelector(".label-tags").value.split(",").map(tag => tag.trim()).filter(Boolean);
    if (!label || !tags.length) continue;
    if (!labels[label]) labels[label] = [];
    labels[label].push(...tags);
  }
  return labels;
}
function syncTableFromForm() {
  const labels = labelTableLabels();
  const formValues = {
    time: document.getElementById("ed-time").value.trim(),
    location: document.getElementById("ed-location").value.trim(),
    people: document.getElementById("ed-people").value.trim(),
    organization: document.getElementById("ed-organization").value.trim(),
    tags: document.getElementById("ed-tags").value.trim(),
    title: document.getElementById("ed-title").value.trim(),
    brief: document.getElementById("ed-brief").value.trim(),
    event: document.getElementById("ed-event").value.trim()
  };
  for (const [label, value] of Object.entries(formValues)) {
    const values = ["time", "location", "people", "organization", "tags"].includes(label)
      ? value.split(",").map(tag => tag.trim()).filter(Boolean)
      : value ? [value] : [];
    if (values.length) labels[label] = values;
    else delete labels[label];
  }
  syncTable(labels);
}
function syncFormFromTable() {
  const labels = labelTableLabels();
  const join = label => (labels[label] || []).join(", ");
  document.getElementById("ed-time").value = join("time");
  document.getElementById("ed-location").value = join("location");
  document.getElementById("ed-people").value = join("people");
  document.getElementById("ed-organization").value = join("organization");
  document.getElementById("ed-tags").value = join("tags");
  document.getElementById("ed-title").value = (labels.title || [""])[0] || "";
  document.getElementById("ed-brief").value = (labels.brief || [""])[0] || "";
  document.getElementById("ed-event").value = (labels.event || [""])[0] || "";
}
document.getElementById("add-label").onclick = () => addLabelRow();
async function loadEventIntoEditor(event, editMode) {
  loadingEditor = true;
  const sourceSelect = document.getElementById("ed-source");
  if (sourceOptions().includes(event.source)) sourceSelect.value = event.source;
  sourceSelect.disabled = !!event.uuid;
  document.getElementById("ed-uuid").value = event.uuid || "(new)";
  document.getElementById("ed-time").value = (event.labels?.time || []).join(", ");
  document.getElementById("ed-location").value = (event.labels?.location || []).join(", ");
  document.getElementById("ed-people").value = (event.labels?.people || []).join(", ");
  document.getElementById("ed-organization").value = (event.labels?.organization || []).join(", ");
  document.getElementById("ed-tags").value = (event.labels?.tags || []).join(", ");
  document.getElementById("ed-title").value = (event.labels?.title || [""])[0] || "";
  document.getElementById("ed-brief").value = (event.labels?.brief || [""])[0] || "";
  document.getElementById("ed-event").value = (event.labels?.event || [""])[0] || "";
  const focus = ["time", "location", "people", "organization", "event"].includes(event.focus_label) ? event.focus_label : "event";
  document.querySelector(`input[name=ed-focus][value="${focus}"]`).checked = true;
  syncTable(event.labels || {});
  document.getElementById("editor-error").textContent = "";
  document.getElementById("editor-title").textContent = event.uuid ? event.abstract || "Event" : "New Event";
  refreshRecordList();
  loadingEditor = false;
  editorDirty = !!event.dirty;
  setEditMode(editMode);
}
function renderDetails(event) {
  const page = document.getElementById("page-details");
  page.replaceChildren();
  if (!event) {
    const empty = document.createElement("p"); empty.className = "dialog-empty";
    empty.textContent = "No event selected."; page.append(empty); return;
  }
  const title = document.createElement("h3");
  title.textContent = (event.labels?.title || ["(untitled)"])[0];
  const meta = document.createElement("div"); meta.className = "detail-value";
  meta.textContent = `${fmtIndexTime(event)} · ${sourceDisplay(event.source)}`;
  page.append(title, meta);
  for (const [label, values] of Object.entries(event.labels || {})) {
    if (!values.length) continue;
    const labelNode = document.createElement("div"); labelNode.className = "detail-label"; labelNode.textContent = label;
    const valueNode = document.createElement("div"); valueNode.className = "detail-value"; valueNode.textContent = values.join("\n");
    page.append(labelNode, valueNode);
  }
}
function markDirty() { if (!loadingEditor) editorDirty = true; }
document.querySelectorAll("#page-form input, #page-form textarea").forEach(input =>
  input.addEventListener("input", markDirty));
async function collectEditorEvent() {
  const source = document.getElementById("ed-source").value;
  if (!source) throw new Error("Source is required.");
  const timeText = document.getElementById("ed-time").value.trim();
  if (!timeText) throw new Error("Time is required.");
  const parsed = await api(`/api/parse_time?text=${encodeURIComponent(timeText)}`);
  if (parsed.since == null) throw new Error(`Cannot parse time: ${timeText}`);
  if (!document.getElementById("page-labels").classList.contains("active")) syncTableFromForm();
  const labels = labelTableLabels();
  const focus = document.querySelector("input[name=ed-focus]:checked").value;
  if (focus === "location" && !labels.location?.length) throw new Error("Focus is Location but location is empty.");
  if (focus === "people" && !labels.people?.length) throw new Error("Focus is People but people is empty.");
  if (focus === "organization" && !labels.organization?.length) throw new Error("Focus is Organization but organization is empty.");
  if (focus === "event" && !(labels.title?.length || labels.brief?.length || labels.event?.length))
    throw new Error("Focus is Event but title/brief/event are all empty.");
  return { uuid: selected?.uuid, source, since: parsed.since, until: parsed.until,
    focus_label: focus, labels };
}
async function applyEditor() {
  const error = document.getElementById("editor-error"); error.textContent = "";
  try {
    const payload = await collectEditorEvent();
    const saved = await api("/api/events", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload)
    });
    await saveSource(saved.source);
    editorDirty = false;
    await reload(); await showEvent(saved.uuid); revealTime(saved.since);
  } catch (error) { error.textContent = error.message; }
}
async function deleteEvent(uuid) {
  const index = allEvents.find(event => event.uuid === uuid);
  const event = selected?.uuid === uuid ? selected : index;
  if (!event) return;
  if (!confirm(`Delete '${index?.abstract || event.abstract || "(untitled)"}'?`)) return;
  await api(`/api/events/${encodeURIComponent(uuid)}`, { method: "DELETE" });
  await saveSource(event.source);
  selected = null; editor.classList.remove("open"); resize();
  await reload();
}
document.getElementById("ed-apply").onclick = applyEditor;
document.getElementById("ed-edit").onclick = () => setEditMode(true);
document.getElementById("ed-cancel").onclick = () => {
  if (confirmDiscard()) loadEventIntoEditor(selected || { source: activeEditorSource(), labels: {}, focus_label: "event" }, false);
};
document.getElementById("ed-close").onclick = () => { if (confirmDiscard()) { editor.classList.remove("open"); resize(); } };
document.getElementById("ed-new").onclick = () => openEditorForNew(activeEditorSource(), "");
document.getElementById("ed-delete").onclick = () => selected && deleteEvent(selected.uuid);
document.getElementById("ed-record").onchange = event => {
  if (event.target.value && confirmDiscard()) showEvent(event.target.value, true);
  else refreshRecordList();
};
document.getElementById("ed-source").onchange = () => {
  if (!confirmDiscard()) return;
  selected = null; refreshRecordList();
  document.getElementById("ed-uuid").value = "(new)";
  document.getElementById("editor-title").textContent = "New Event";
};
function confirmDiscard() {
  if (!editorDirty || confirm("Discard unsaved changes?")) { editorDirty = false; return true; }
  return false;
}
function openEditorForNew(source, presetTime = "") {
  if (!source) { openFileDialog(); return; }
  savedLockedValues = {};
  for (const [id, label] of [["lock-time", "time"], ["lock-location", "location"],
    ["lock-people", "people"], ["lock-organization", "organization"], ["lock-tags", "tags"]]) {
    const value = document.getElementById(`ed-${label}`).value.trim();
    if (document.getElementById(id).checked && value) savedLockedValues[label] = value;
  }
  const event = { uuid: "", source, since: null, until: null, focus_label: "event", labels: {}, dirty: true };
  for (const [label, value] of Object.entries(savedLockedValues)) event.labels[label] = [value];
  if (presetTime && !savedLockedValues.time) event.labels.time = [presetTime];
  selected = null;
  editor.classList.add("open"); resize();
  loadEventIntoEditor(event, true);
}

/* ---------- quick entry ---------------------------------------------------------- */
function openQuickEntry(thread, timeText) {
  if (!thread || thread.custom || !thread.source) { alert("Select a writable source thread first."); return; }
  quickThread = thread;
  document.getElementById("quick-target").textContent = `Target source: ${thread.source}`;
  document.getElementById("quick-title").value = "";
  document.getElementById("quick-time").value = timeText;
  document.getElementById("quick-error").textContent = "";
  openDialog("quick-dialog");
}
document.getElementById("quick-apply").onclick = async () => {
  const error = document.getElementById("quick-error"); error.textContent = "";
  try {
    const title = document.getElementById("quick-title").value.trim();
    if (!title) throw new Error("Title is required.");
    const timeText = document.getElementById("quick-time").value.trim();
    const parsed = await api(`/api/parse_time?text=${encodeURIComponent(timeText)}`);
    if (parsed.since == null) throw new Error(`Cannot parse time: ${timeText}`);
    const saved = await api("/api/events", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ source: quickThread.source, since: parsed.since, until: parsed.until,
        focus_label: "event", labels: { title: [title], time: [timeText] } })
    });
    closeDialog("quick-dialog");
    await saveSource(quickThread.source);
    await reload(); await showEvent(saved.uuid); revealTime(saved.since);
  } catch (caught) { error.textContent = caught.message; }
};

/* ---------- view helpers and websocket -------------------------------------------- */
function fitToView() {
  const times = [];
  for (const thread of threads) for (const event of thread.events)
    if (event.since != null) { times.push(usToJd(event.since)); times.push(usToJd(event.until ?? event.since)); }
  if (!times.length) return;
  const lo = Math.min(...times), hi = Math.max(...times);
  viewState.centerJd = (lo + hi) / 2;
  viewState.pxPerDay = axisLength() * 0.9 / Math.max(hi - lo, 365);
  layout(); draw(); persist();
}
function toggleOrientation() {
  viewState.orientation = viewState.orientation === "horizontal" ? "vertical" : "horizontal";
  layout(); draw(); persist();
}
function revealTime(us) {
  if (us == null) return;
  const jd = usToJd(us), half = axisLength() / 2 / viewState.pxPerDay;
  if (jd < viewState.centerJd - half || jd > viewState.centerJd + half) {
    viewState.centerJd = jd; layout(); draw(); persist();
  }
}
function setStatus(text) { document.getElementById("status").textContent = text; }
function showTextDialog(title, text) {
  document.getElementById("text-title").textContent = title;
  document.getElementById("text-body").textContent = text;
  openDialog("text-dialog");
}
function connectWs() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const socket = new WebSocket(`${proto}://${location.host}/ws`);
  socket.onopen = () => setStatus("live");
  socket.onmessage = () => reload().catch(error => setStatus(`reload failed: ${error.message}`));
  socket.onclose = () => {
    setStatus("disconnected — retrying…");
    setTimeout(connectWs, 2000);
  };
}
window.addEventListener("resize", resize);
resize();
reload().catch(error => setStatus(`load failed: ${error.message}`));
connectWs();
